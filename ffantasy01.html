    <style>
        :root { --main-bg: #1a1a2e; --ui-panel: #16213e; --accent: #4ecca3; }
       
        /* 1. 鎖死最外層 Body，唔准佢上下滑動 */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; /* 必定要用 dvh，動態適應手機瀏覽器高度 */
            overflow: hidden; /* 隱藏所有超出螢幕嘅嘢，防止出現捲軸 */
            background-color: #1a1e36; /* 你原本嘅深藍色背景 */
        }       
        /* 啟動遮罩 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 25, 0.95); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-screen input { padding: 12px; font-size: 18px; border-radius: 5px; border: 2px solid var(--accent); background: #0f3460; color: white; margin-bottom: 15px; width: 250px; text-align: center; }
        #start-screen button { padding: 12px 40px; font-size: 18px; cursor: pointer; background: var(--accent); border: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        #start-screen button:disabled { background: #555; cursor: not-allowed; }

        /* 2. 主容器：採用 Flex 垂直排列 */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%; /* 填滿 body */
        }

        /* 3. 畫布 (地圖/戰鬥畫面)：自動填滿剩餘空間，但絕不越界！ */
        canvas {
            width: 100%;
            flex: 1;          /* 自動佔據上方所有可用空間 */
            min-height: 0;    /* 🌟 極度關鍵！防止畫布自身高度撐爆外框 */
            object-fit: cover; 
            display: block;
        }

        /* 4. 底部控制面板 (方向鍵 / 攻擊按鈕)：鎖死高度，絕不被擠壓 */
        #ui-panel { /* 假設你裝住按鈕嗰個 div 叫 ui-panel，請根據你實際嘅 ID 修改 */
            width: 100%;
            flex-shrink: 0;   /* 🌟 極度關鍵！就算上面畫布幾大，都唔准縮小或擠走呢個面板 */
            box-sizing: border-box;
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* 避開 iPhone 條黑線 */
            background-color: #1a1e36;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            /* 如果內容太多要捲動，可以加 overflow-y: auto; */
        }
        #question { font-size: 20px; color: var(--accent); min-height: 60px; text-align: center; font-weight: bold; line-height: 1.4; }
        
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .opt-btn { 
            background: #0f3460; color: #fff; border: 1px solid var(--accent); padding: 15px; 
            cursor: pointer; border-radius: 8px; font-size: 16px; transition: 0.3s;
        }
        .opt-btn:hover:not(:disabled) { background: var(--accent); color: #1a1a2e; }
        .opt-btn:disabled { opacity: 0.5; }

        #battleLog { font-size: 14px; color: #aaa; margin-top: 15px; text-align: center; height: 20px; }
        /* 必殺技按鈕呼吸燈效果 */
        @keyframes glow {
            0% { box-shadow: 0 0 5px #9b59b6; }
            50% { box-shadow: 0 0 20px #9b59b6; }
            100% { box-shadow: 0 0 5px #9b59b6; }
        }

        #ult-btn {
             animation: glow 1.5s infinite;
            font-weight: bold;
            color: white;
        }

        /* 讓面板切換時不要跳動太厲害 */
        #ui-panel {
            min-height: 250px; /* 固定最小高度 */
        }
        
        /* 虛擬方向鍵排版與美化 */
        #dpad-container {
            /* 🌟 新增呢 4 行：將個掣鎖死喺左下角 */
            position: fixed;   
            bottom: 40px;      /* 距離螢幕底部 40px (可以自己改數字微調) */
            left: 20px;        /* 距離螢幕左邊 20px */
            z-index: 1000;     /* 確保佢喺最頂層，唔會畀其他嘢遮住 */

            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px; /* 兩行高 */
            gap: 8px;
            justify-content: center;
        }
        .dpad-btn {
            background: #0f3460;
            color: #fff;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            user-select: none; /* 防止手機點擊時選取文字 */

            justify-content: center;
            align-items: center;
            transition: 0.1s;
        }
        .dpad-btn:active {
            background: var(--accent);
            color: #1a1a2e;
            transform: scale(0.95); /* 按下時稍微縮細，增加手感 */
        }

// --- [2] 核心類別 ---
class FloatingText {
    constructor(value, x, y, color) {
        this.value = value; this.x = x; this.y = y; this.color = color;
        this.opacity = 1; this.life = 60;
    }
    update() { this.y -= 1.2; this.life--; this.opacity = this.life / 60; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
        ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
        ctx.fillText(this.value, this.x, this.y); ctx.restore();
    }
}

class Character {
    
    constructor(name, hp, atk, x, y, img, w, h, isPlayer) {
        // ... 原有屬性 ...
        this.name = name; this.maxHp = hp; this.hp = hp; this.atk = atk;
        this.x = x; this.y = y; this.img = img; this.w = w; this.h = h;
        this.isPlayer = isPlayer;
        this.shakeTimer = 0; this.flashTimer = 0; this.displayHp = hp;
        this.sp = 0;             // 能量值 (0-100)
        this.isDefending = false; // 是否防禦中
        // --- 新增：地圖系統的座標 ---
        this.mapX = 1; // 陣列中的 X (行)
        this.mapY = 1; // 陣列中的 Y (列)
    }
takeDamage(amount) {
        // 如果正在防禦，傷害減半
        let finalDamage = this.isDefending ? Math.floor(amount * 0.5) : amount;
        this.hp = Math.max(0, this.hp - finalDamage);
        
        this.shakeTimer = 15; 
        this.flashTimer = 5;
        
        // 浮動文字顯示計算後的傷害 (finalDamage)
        damageTexts.push(new FloatingText(`-${finalDamage}`, this.x + this.w/2, this.y, this.isPlayer ? "#ff4d4d" : "#ffd54f"));
        
        this.isDefending = false; // 受傷後解除防禦狀態
        return finalDamage;
    }

    update() { 
        if (this.displayHp > this.hp) this.displayHp -= 0.5; 
    }
draw(ctx) {
    this.update(); 
    ctx.save();
    
    // 1. 處理震動與閃白效果
    let rx = this.x; 
    if (this.shakeTimer > 0) { 
        rx += (Math.random() - 0.5) * 10; 
        this.shakeTimer--; 
    }
    if (this.flashTimer > 0) { 
        ctx.filter = "brightness(3)"; 
        this.flashTimer--; 
    }

    // 2. 畫出角色圖片
    let imgToDraw = this.img; // 預設用正常圖片
    if (this.hp <= 0) {
        // 如果血量歸零，判斷係主角定怪物，用對應嘅戰敗圖
        imgToDraw = this.isPlayer ? assets.playerDead : assets.monsterDead;
    }
    ctx.drawImage(imgToDraw, rx, this.y, this.w, this.h);    ctx.filter = "none"; 
    // 畫完圖片後重設濾鏡，避免影響後面的條狀圖

    // 3. 繪製血條 (HP Bar)
    const barW = this.w; 
    const hpPct = this.displayHp / this.maxHp;
    ctx.fillStyle = "#333"; 
    ctx.fillRect(rx, this.y - 15, barW, 6); // 背景深灰色
    ctx.fillStyle = hpPct < 0.3 ? "#ff4d4d" : (hpPct < 0.6 ? "#ffd54f" : "#4caf50");
    ctx.fillRect(rx, this.y - 15, barW * hpPct, 6); // 根據血量比例填色

    // ----------------------------------------------------
    // 4. 新增：繪製能量條 (SP Bar) - 僅限主角
    // ----------------------------------------------------
    if (this.isPlayer) {
        const spPct = Math.min(this.sp / 100, 1); // 能量比例 (0 ~ 1)
        
        // 能量條背景 (深藍黑色)
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
        ctx.fillRect(rx, this.y - 7, barW, 4); 
        
        // 能量條填色 (亮藍色)
        ctx.fillStyle = "#3498db"; 
        ctx.fillRect(rx, this.y - 7, barW * spPct, 4);

        // 如果能量滿了，加一個發光的外框效果
        if (this.sp >= 100) {
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(rx, this.y - 7, barW, 4);
        }
    }
    // ----------------------------------------------------

    // 5. 繪製名字
        ctx.fillStyle = "white"; 
        ctx.font = "bold 12px Arial"; 
        ctx.textAlign = "center";
        ctx.fillText(this.name, rx + this.w / 2, this.y - 25); 
        
        ctx.restore();
    } // ⬅️ 確保 draw() 喺呢度閂括號完結！

    // --- 將 drawOnMap 獨立放喺 draw() 下面 ---
    drawOnMap(ctx) {
        let px = this.mapX * TILE_SIZE - camX;
        let py = this.mapY * TILE_SIZE - camY;
        ctx.drawImage(this.img, px, py, TILE_SIZE, TILE_SIZE);
    }
}

// 3. 處理答題結果 (替換原本的 checkAnswer)
function checkAnswer(choice) {
    if (isBusy || player.hp <= 0 || monster.hp <= 0) return;
    isBusy = true;
    
    const btns = document.querySelectorAll('#optionsContainer .opt-btn');
    btns.forEach(b => b.disabled = true);

    if (choice === currentQ.ans) {
        // 🌟 播放答對音效
        sounds.correct.currentTime = 0;
        sounds.correct.play();
        
        if (currentAction === 'ult') {
            // 原本的必殺攻擊
            sounds.attack.play(); // 必殺攻擊聲
            
            let dmg = player.atk * 3;
            player.sp = 0;
            monster.takeDamage(dmg);
            document.getElementById('battleLog').innerText = "🔥 必殺：極限運算！造成 3 倍傷害！";
            document.getElementById('battleLog').style.color = "#9b59b6";
        } 
        else if (currentAction === 'heal') {
            sounds.heal.play();   // 回復聲
            
            // 新增：必殺回復
            let healAmount = Math.floor(player.maxHp * 0.7); // 回復 70% HP
            player.hp = Math.min(player.maxHp, player.hp + healAmount);
            player.sp = 0;
            // 顯示綠色回復文字
            damageTexts.push(new FloatingText(`+${healAmount}`, player.x + player.w/2, player.y, "#2ecc71"));
            document.getElementById('battleLog').innerText = `💖 數之治癒！回復了 ${healAmount} 點 HP！`;
            document.getElementById('battleLog').style.color = "#2ecc71";
        } 
        else {
            // 普攻
            sounds.attack.play(); // 普通攻擊聲
            
            player.sp = Math.min(100, player.sp + 25);
            monster.takeDamage(player.atk);
            document.getElementById('battleLog').innerText = "✅ 正確！發動精準打擊！";
            document.getElementById('battleLog').style.color = "#4ecca3";
        }

        if (monster.hp <= 0) { winBattle(); return; }
        setTimeout(showActionMenu, 1500); 

    } else {
        // 答錯咗
        // 🌟 播放答錯音效
        sounds.wrong.currentTime = 0;
        sounds.wrong.play();
        
        document.getElementById('battleLog').innerText = "❌ 算錯了！招式被斷，考官趁機反擊！";
        document.getElementById('battleLog').style.color = "#ff4d4d";
        if (currentAction === 'ult' || currentAction === 'heal') {
            // 如果係放必殺技答錯，可以懲罰扣返少少 SP 或者由佢維持 100 
            // 呢度設定為答錯唔扣 SP，但要俾人打
        }
        setTimeout(enemyTurn, 1000);
    }
}

// 4. 怪物回合 (替換原本的 enemyTurn)
function enemyTurn() {
    if (monster.hp <= 0 || player.hp <= 0) return;
    
    // 傷害亂數 (加入 20% 浮動)
    const variance = 0.2;
    const minDmg = Math.floor(monster.atk * (1 - variance));
    const maxDmg = Math.floor(monster.atk * (1 + variance));
    let finalDamage = Math.floor(Math.random() * (maxDmg - minDmg + 1)) + minDmg;

    // 呼叫 takeDamage (裡面已經寫好如果 isDefending = true 會減半傷害)
    player.takeDamage(finalDamage);
    
    document.getElementById('battleLog').innerText = `考官發動攻擊，造成 ${finalDamage} 點傷害！`;
    document.getElementById('battleLog').style.color = "#ff4d4d";
    
     if (player.hp <= 0) {
         player.hp = 0;
        document.getElementById('battleLog').innerText = "💀 勇者倒下了... Game Over！";
    
        // 🌟 喺度加入上傳分數！(傳入目前關卡)
        submitScore(currentLevel);
        setTimeout(() => {
        location.reload(); // 最簡單的做法：重新整理網頁
      }, 2000);
        } else {
        // 怪物攻擊完畢後，1.5 秒後回到玩家的指令選單
        setTimeout(showActionMenu, 1500);
    }
}

// 新增勝利處理函式
function winBattle() {
    isBusy = true;
    document.getElementById('battleLog').innerText = "✌️ 戰鬥勝利！";
    document.getElementById('battleLog').style.color = "#4ecca3";
    
    // 🌟 新增：重設畫布濾鏡，將顏色變返原狀
    document.getElementById('battleCanvas').style.filter = "none";
    
    if (player.lastTrapPos) {
        currentMapData[player.lastTrapPos.y][player.lastTrapPos.x] = 0;
        player.lastTrapPos = null; 
    }

    score += 100;
    
    // 呢度淨係顯示文字提示，刪除咗原本嘅 currentLevel++ 同地圖設定
    if (encounterType === "BOSS") {
        alert(`成功擊敗 ${monster.name}！`);
    } else {
        alert(`成功擊退了 ${monster.name}！獲得經驗！`);
    }

    // 🌟 新增：戰鬥音樂停止
    sounds.battleBgm.pause();
    sounds.battleBgm.currentTime = 0;
    
    // 延遲 1.5 秒後返回地圖
    setTimeout(() => {
        // ✅ 將 Boss 過關升級嘅邏輯搬到呢度！等 1.5 秒後先正式升級
        if (encounterType === "BOSS") {
            currentLevel++;
            
            if (currentLevel > 6) {
                alert("🎉 恭喜你！你已經通關所有 DSE 數學挑戰！");
                gameState = "END";
                submitScore(currentLevel);
                return; // 爆機停止執行
            }
            // 載入新地圖，重置主角位置
            currentMapData = levelConfigs[currentLevel].mapGrid;
            player.mapX = levelConfigs[currentLevel].startX;
            player.mapY = levelConfigs[currentLevel].startY;      
            alert(`即將進入第 ${currentLevel} 關：${levelConfigs[currentLevel].name}`);
        }

        gameState = "MAP";
        
        // 🎵 👇 關鍵修復：回到地圖時，重新播放地圖音樂！
        playMusic(sounds.mapBgm, 0.3); // 地圖音樂音量設定為 0.3
        
        player.hp = player.maxHp; // 過關補滿血
        isBusy = false;
        
        // UI 切換處理
        document.getElementById('action-menu').style.display = 'none'; 
        document.getElementById('quiz-area').style.display = 'none';   
        document.getElementById('dpad-container').style.display = 'flex'; 
        
        document.getElementById('battleLog').innerText = "探索中...";
        document.getElementById('battleLog').style.color = "#aaa";
    }, 1500);
}
    
// 重置怪物的函式
function resetMonster() {
    monster.hp = monster.maxHp;
    monster.displayHp = monster.maxHp;
    // 如果有不同種類的怪物，也可以在這裡隨機更換圖片或數值
    monster.atk = 25; 
    const canvas = document.getElementById('battleCanvas');
    canvas.style.filter = "none"; // 清除狂暴化濾鏡
}
// --- 替換原本的 resetMonster 函式 ---
// 根據傳入嘅資料嚟設定目前嘅怪獸
function setMonsterData(data) {
    monster.name = data.name;
    monster.maxHp = data.hp;
    monster.hp = data.hp;
    monster.displayHp = data.hp;
    monster.atk = data.atk;
    monster.img = data.img;
    document.getElementById('battleCanvas').style.filter = "none"; // 清除狂暴濾鏡
}


function finishGame(msg) {
    document.getElementById('battleLog').innerText = msg;
    uploadData();
}

function uploadData() {
    const URL = "https://script.google.com/macros/s/AKfycbxz-lYcExIyf8NomxvYRqAoYehNyKHh_xVvINJRk6hiOFz3Z4dl_HZgxcuV4abjh6LvpQ/exec"; 
    const data = { name: playerName, score: score, date: new Date().toLocaleString() };
    if (URL.includes("你的_GOOGLE")) {
        alert(`遊戲結束！玩家：${playerName}, 分數：${score}`);
        return;
    }
    fetch(URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) })
    .then(() => alert("成績已上傳至 Google Sheet！"));
}
    
function drawMap() {
    updateCamera(); // 畫地圖前先更新相機位置
    
    // 攞目前關卡專用嘅圖案
    let currentConfig = levelConfigs[currentLevel];
    let gImg = currentConfig.groundImg || assets.tileGround;
    let wImg = currentConfig.wallImg || assets.tileWall;
    let grassImg = currentConfig.grassImg || assets.tileGrass; 
    let bossMapImg = currentConfig.mapBossImg || assets.toround2; // 👈 🌟 新增這行：動態讀取 Boss 圖案
    
    for (let row = 0; row < currentMapData.length; row++) {
        for (let col = 0; col < currentMapData[row].length; col++) {
            let tile = currentMapData[row][col];
            let x = col * TILE_SIZE - camX;
            let y = row * TILE_SIZE - camY;

            if (x + TILE_SIZE < 0 || x > canvas.width || y + TILE_SIZE < 0 || y > canvas.height) continue;

            ctx.drawImage(gImg, x, y, TILE_SIZE, TILE_SIZE);
            
            if (tile === 1) ctx.drawImage(wImg, x, y, TILE_SIZE, TILE_SIZE);
            else if (tile === 2) ctx.drawImage(grassImg, x, y, TILE_SIZE, TILE_SIZE);
            else if (tile === 3) ctx.drawImage(grassImg, x, y, TILE_SIZE, TILE_SIZE);
            else if (tile === 4) ctx.drawImage(bossMapImg, x, y, TILE_SIZE, TILE_SIZE); // 👈 🌟 關鍵修改：將 assets.toround2 改為 bossMapImg
        }
    }
}


function movePlayer(dx, dy) {
    if (gameState !== "MAP") return;
    // 🎵 新增這段：確保地圖音樂有在播放。
    // 如果因為換關卡的 alert 被瀏覽器強制暫停，就在玩家行第一步時立刻恢復播放！
    if (sounds.mapBgm.paused && !isMuted) {
        sounds.mapBgm.play().catch(e => console.log("等待互動才能播放音樂:", e));
    }
    
    let nextX = player.mapX + dx;
    let nextY = player.mapY + dy;

    if (currentMapData[nextY][nextX] === 1) return; // 撞牆

    player.mapX = nextX;
    player.mapY = nextY;

    let currentTile = currentMapData[nextY][nextX];

    if (currentTile === 4) {
        document.getElementById('battleLog').innerText = "💀 遇見 BOSS！";
        player.lastTrapPos = {x: nextX, y: nextY}; 
        encounterType = "BOSS";
        startEncounterEffect();
    } else if (currentTile === 3) {
        document.getElementById('battleLog').innerText = "⚠️ 踩到隱藏機關！";
        player.lastTrapPos = {x: nextX, y: nextY}; 
        encounterType = "TRAP";
        startEncounterEffect();
    } else if (currentTile === 2) {
        if (Math.random() < 0.15) {
            document.getElementById('battleLog').innerText = "⚠️ 有動靜！";
            encounterType = "RANDOM";
            startEncounterEffect();
        }
    }
}
// 啟動隨機戰鬥 (草叢遇敵)
function startRandomBattle() {
    gameState = "BATTLE";
    resetMonster(); // 確保怪物血量滿格
    showActionMenu();
    document.getElementById('battleLog').innerText = "⚔️ 草叢中衝出了一隻 DSE 考官！";
}

    // 啟動遇敵閃爍特效
function startEncounterEffect() {
    gameState = "TRANSITION";
    transitionTimer = 0;
    
    // 隱藏所有 UI，等玩家專心睇特效
    document.getElementById('ui-panel').style.display = 'none';
}   
    
// 啟動強制戰鬥
function startForcedBattle(x, y) {
    // 進入戰鬥狀態
    gameState = "BATTLE";
    
    // 戰鬥勝利後要移除這個座標的機關，我們把它存起來
    player.lastTrapPos = {x: x, y: y}; 
    
    resetMonster(); // 確保怪物血量滿格
    showActionMenu();
}
// --- 監聽鍵盤按鍵來移動主角 ---
window.addEventListener('keydown', (e) => {
    // 如果不是在地圖模式，或者遊戲還沒開始，就不允許移動
    if (gameState !== "MAP") return; 

    // W, A, S, D 或 上下左右方向鍵
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
});    
    
// 上傳分數的函數（在爆機或死亡時呼叫）
function submitScore(finalLevel) {
    const timeSpent = Math.floor((Date.now() - startTime) / 1000); // 總秒數
    const hpBonus = player.hp * 10;
    
    // 結算總分 (答題加減分可以在 checkAnswer 裡面做)
    score += (finalLevel * 2000) + hpBonus - timeSpent;
    if (score < 0) score = 0;
    
    alert(`結算完成！你的總分是：${score} 分！正在上傳成績...`);

    const data = {
        name: playerName,
        score: score,
        level: finalLevel
    };

    fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data) // Google Apps Script 收 JSON
    }).then(() => {
        alert("成績已成功上傳！");
    }).catch(err => {
        alert("上傳失敗，請檢查網路連線。");
    });
}

    
function gameLoop() {
    // 自動同步畫布內部解析度與手機實際大細
    if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    } 
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "MAP") {
        drawMap();
        player.drawOnMap(ctx);

    } else if (gameState === "TRANSITION") {
        drawMap();
        player.drawOnMap(ctx);
        
        transitionTimer++;
        if (transitionTimer % 10 < 5) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; 
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)"; 
        }
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 閃咗大約 1.5 秒之後，正式進入戰鬥
        if (transitionTimer > 90) {
            gameState = "BATTLE";
            // 🌟 新增：切換音樂
            sounds.mapBgm.pause();
            playMusic(sounds.battleBgm, 0.2); // 使用上面的函數，強制指定音量為 0.2
            
             let currentConfig = levelConfigs[currentLevel]; // 攞目前關卡資料          
            
            // 🌟 關鍵修復：區分遇敵類型
            if (encounterType === "RANDOM" || encounterType === "TRAP") {
             // 🌟 關鍵修復：喺目前關卡專屬嘅小怪名單度抽！
                let mobsList = currentConfig.mobs;
                let randomMob = mobsList[Math.floor(Math.random() * mobsList.length)];
                setMonsterData({ name: randomMob.name, hp: randomMob.hp, atk: randomMob.atk, img: randomMob.img });
                document.getElementById('battleLog').innerText = `⚔️ 野生的 ${randomMob.name} 撲過來了！`;
            } else if (encounterType === "BOSS") {
                // 讀取關卡 Boss 設定
                let currentConfig = levelConfigs[currentLevel];
                setMonsterData({
                    name: currentConfig.monsterName,
                    hp: currentConfig.monsterHp,
                    atk: currentConfig.monsterAtk,
                    img: currentConfig.monsterImg
                });
                document.getElementById('battleLog').innerText = `⚔️ 最終決戰！${currentConfig.monsterName} 出現了！`;
            }
            
            showActionMenu();
        }

    } else if (gameState === "BATTLE") {
        player.x = canvas.width * 0.1;  
        player.y = canvas.height * 0.75 - player.h; // 🌟 微調：減去自身高度避免超出底部
        
        monster.x = canvas.width * 0.6; 
        monster.y = canvas.height * 0.60 - monster.h;

        // 🌟 關鍵修復：畫目前關卡專屬嘅戰鬥背景
        let bg = levelConfigs[currentLevel].bgImg || assets.background;
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);       
        player.draw(ctx);
        monster.draw(ctx);
        
        // 🌟 關鍵修復：用 filter 清理浮動文字，唔好用 splice
        damageTexts.forEach(text => {
            text.update();
            text.draw(ctx);
        });
        damageTexts = damageTexts.filter(text => text.life > 0);
        
    } else if (gameState === "END") {
        // 🌟 關鍵修復：爆機畫面
        ctx.fillStyle = "#1a1a2e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#4ecca3";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("🎉 恭喜通關！", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("你是真正的 DSE 數學大師！", canvas.width / 2, canvas.height / 2 + 20);
    }
    
    requestAnimationFrame(gameLoop);
}
    
</script>
