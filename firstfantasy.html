<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE Math First Fantasy</title>
    <style>
        :root { --main-bg: #1a1a2e; --ui-panel: #16213e; --accent: #4ecca3; }
        body { background: var(--main-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        
        /* 啟動遮罩 */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 25, 0.95); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-screen input { padding: 12px; font-size: 18px; border-radius: 5px; border: 2px solid var(--accent); background: #0f3460; color: white; margin-bottom: 15px; width: 250px; text-align: center; }
        #start-screen button { padding: 12px 40px; font-size: 18px; cursor: pointer; background: var(--accent); border: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        #start-screen button:disabled { background: #555; cursor: not-allowed; }

        /* 遊戲容器 */
        #game-wrapper {
            margin-top: 20px;
            border: 4px solid #fff;
            border-radius: 8px;
            width: 95%;        /* 改為佔螢幕 95% */
            max-width: 800px;  /* 設定最大上限，避免在大螢幕太闊 */
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            background: #232946;
            display: block;
            width: 100%;       /* 讓畫布跟隨容器寬度自動縮放 */
            height: auto;      /* 保持比例 */
        }
        /* UI 面板 */
        #ui-panel { background: var(--ui-panel); padding: 20px; box-sizing: border-box; border-top: 2px solid #fff; }
        #question { font-size: 20px; color: var(--accent); min-height: 60px; text-align: center; font-weight: bold; line-height: 1.4; }
        
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .opt-btn { 
            background: #0f3460; color: #fff; border: 1px solid var(--accent); padding: 15px; 
            cursor: pointer; border-radius: 8px; font-size: 16px; transition: 0.3s;
        }
        .opt-btn:hover:not(:disabled) { background: var(--accent); color: #1a1a2e; }
        .opt-btn:disabled { opacity: 0.5; }

        #battleLog { font-size: 14px; color: #aaa; margin-top: 15px; text-align: center; height: 20px; }
        /* 必殺技按鈕呼吸燈效果 */
        @keyframes glow {
            0% { box-shadow: 0 0 5px #9b59b6; }
            50% { box-shadow: 0 0 20px #9b59b6; }
            100% { box-shadow: 0 0 5px #9b59b6; }
        }

        #ult-btn {
             animation: glow 1.5s infinite;
            font-weight: bold;
            color: white;
        }

        /* 讓面板切換時不要跳動太厲害 */
        #ui-panel {
            min-height: 250px; /* 固定最小高度 */
        }
        
        /* 虛擬方向鍵排版與美化 */
        #dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px; /* 兩行高 */
            gap: 8px;
            justify-content: center;
        }
        .dpad-btn {
            background: #0f3460;
            color: #fff;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            user-select: none; /* 防止手機點擊時選取文字 */
            touch-action: manipulation; /* 提升手機點擊反應速度 */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
        }
        .dpad-btn:active {
            background: var(--accent);
            color: #1a1a2e;
            transform: scale(0.95); /* 按下時稍微縮細，增加手感 */
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--accent)">數學First Fantasy1</h1>
    <input type="text" id="playerNameInput" placeholder="輸入玩家姓名..." maxlength="10">
    <button id="startBtn" onclick="startGame()" disabled>素材載入中...</button>
</div>

<div id="game-wrapper">
    <canvas id="battleCanvas" width="600" height="300"></canvas>
    <div id="ui-panel">
        <div id="dpad-container" style="display: none;">
            <div style="text-align: center; margin-bottom: 10px; color: #aaa;">移動角色</div>
            <div class="dpad-grid">
                <div></div> <button class="dpad-btn" onclick="movePlayer(0, -1)">▲</button>
                <div></div> <button class="dpad-btn" onclick="movePlayer(-1, 0)">◀</button>
                <button class="dpad-btn" onclick="movePlayer(0, 1)">▼</button>
                <button class="dpad-btn" onclick="movePlayer(1, 0)">▶</button>
            </div>
        </div>
    <div id="action-menu" style="display: block;">
        <div style="text-align: center; margin-bottom: 10px; color: #4ecca3; font-weight: bold;">選擇行動：</div>

            <button class="opt-btn" onclick="selectAction('defend')">🛡️ 進入防禦</button>
            <button id="ult-btn" class="opt-btn" onclick="selectAction('ult')" style="display: none; background: #9b59b6; border-color: #d1a3e0;">🔥 必殺：極限運算</button>
        </div>
    </div>

    <div id="quiz-area" style="display: none;">
        <div id="question">題目載入中...</div>

    </div>

    <div id="battleLog">準備戰鬥！</div>
    </div>
</div>

const regularMonsters = [

// 0=平地, 1=牆壁, 2=草叢(隨機遇敵), 3=隱藏機關(強制遇敵)

const mapData = [

const TILE_SIZE = 40; // 每個格子的大小（像素）   
// --- [2] 核心類別 ---
class FloatingText {
    constructor(value, x, y, color) {
        this.value = value; this.x = x; this.y = y; this.color = color;
        this.opacity = 1; this.life = 60;
    }
    update() { this.y -= 1.2; this.life--; this.opacity = this.life / 60; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
        ctx.font = "bold 26px Arial"; ctx.textAlign = "center";
        ctx.fillText(this.value, this.x, this.y); ctx.restore();
    }
}

class Character {
    
    constructor(name, hp, atk, x, y, img, w, h, isPlayer) {
        // ... 原有屬性 ...
        this.name = name; this.maxHp = hp; this.hp = hp; this.atk = atk;
        this.x = x; this.y = y; this.img = img; this.w = w; this.h = h;
        this.isPlayer = isPlayer;
        this.shakeTimer = 0; this.flashTimer = 0; this.displayHp = hp;
        this.sp = 0;             // 能量值 (0-100)
        this.isDefending = false; // 是否防禦中
        // --- 新增：地圖系統的座標 ---
        this.mapX = 1; // 陣列中的 X (行)
        this.mapY = 1; // 陣列中的 Y (列)
    }
takeDamage(amount) {
        // 如果正在防禦，傷害減半
        let finalDamage = this.isDefending ? Math.floor(amount * 0.5) : amount;
        this.hp = Math.max(0, this.hp - finalDamage);
        
        this.shakeTimer = 15; 
        this.flashTimer = 5;
        
        // 浮動文字顯示計算後的傷害 (finalDamage)
        damageTexts.push(new FloatingText(`-${finalDamage}`, this.x + this.w/2, this.y, this.isPlayer ? "#ff4d4d" : "#ffd54f"));
        
        this.isDefending = false; // 受傷後解除防禦狀態
        return finalDamage;
    }

    update() { 
        if (this.displayHp > this.hp) this.displayHp -= 0.5; 
    }
draw(ctx) {
    this.update(); 
    ctx.save();
    
    // 1. 處理震動與閃白效果
    let rx = this.x; 
    if (this.shakeTimer > 0) { 
        rx += (Math.random() - 0.5) * 10; 
        this.shakeTimer--; 
    }
    if (this.flashTimer > 0) { 
        ctx.filter = "brightness(3)"; 
        this.flashTimer--; 
    }

    // 2. 畫出角色圖片
    let imgToDraw = this.img; // 預設用正常圖片
    if (this.hp <= 0) {
        // 如果血量歸零，判斷係主角定怪物，用對應嘅戰敗圖
        imgToDraw = this.isPlayer ? assets.playerDead : assets.monsterDead;
    }
    ctx.drawImage(imgToDraw, rx, this.y, this.w, this.h);    ctx.filter = "none"; 
    // 畫完圖片後重設濾鏡，避免影響後面的條狀圖

    // 3. 繪製血條 (HP Bar)
    const barW = this.w; 
    const hpPct = this.displayHp / this.maxHp;
    ctx.fillStyle = "#333"; 
    ctx.fillRect(rx, this.y - 15, barW, 6); // 背景深灰色
    ctx.fillStyle = hpPct < 0.3 ? "#ff4d4d" : (hpPct < 0.6 ? "#ffd54f" : "#4caf50");
    ctx.fillRect(rx, this.y - 15, barW * hpPct, 6); // 根據血量比例填色

    // ----------------------------------------------------
    // 4. 新增：繪製能量條 (SP Bar) - 僅限主角
    // ----------------------------------------------------
    if (this.isPlayer) {
        const spPct = Math.min(this.sp / 100, 1); // 能量比例 (0 ~ 1)
        
        // 能量條背景 (深藍黑色)
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
        ctx.fillRect(rx, this.y - 7, barW, 4); 
        
        // 能量條填色 (亮藍色)
        ctx.fillStyle = "#3498db"; 
        ctx.fillRect(rx, this.y - 7, barW * spPct, 4);

        // 如果能量滿了，加一個發光的外框效果
        if (this.sp >= 100) {
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(rx, this.y - 7, barW, 4);
        }
    }
    // ----------------------------------------------------

    // 5. 繪製名字
    ctx.fillStyle = "white"; 
    ctx.font = "bold 12px Arial"; 
    ctx.textAlign = "center";
    ctx.fillText(this.name, rx + this.w / 2, this.y - 25); 
    
    ctx.restore();
}
// --- 新增：在地圖上畫出角色 ---
// 主角的 drawOnMap 也要改
    Character.prototype.drawOnMap = function(ctx) {
        let px = this.mapX * TILE_SIZE - camX;
        let py = this.mapY * TILE_SIZE - camY;
        ctx.drawImage(this.img, px, py, TILE_SIZE, TILE_SIZE);
    } 
}

// --- [3] 遊戲邏輯 ---
const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');
const player = new Character("勇者", 100, 40, 80, 140, assets.player, 80, 80, true);
const monster = new Character("DSE 考官", 150, 25, 420, 120, assets.monster, 100, 100, false);

function startGame() {
    playerName = document.getElementById('playerNameInput').value.trim();
    if (!playerName) { alert("請輸入姓名！"); return; }
    document.getElementById('start-screen').style.display = 'none';
    
    // 初始化設定為地圖模式
    gameState = "MAP"; 
    
    // 👇 修改呢度：顯示主面板，顯示方向鍵，但隱藏戰鬥 UI
    document.getElementById('ui-panel').style.display = 'block';
    document.getElementById('dpad-container').style.display = 'flex';
    document.getElementById('action-menu').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'none';   
    
    gameLoop();
}
// 全域變數
let camX = 0;
let camY = 0;

function updateCamera() {
    // 理想目標：主角座標 - 畫布一半
    let targetX = (player.mapX * TILE_SIZE) - (canvas.width / 2) + (TILE_SIZE / 2);
    let targetY = (player.mapY * TILE_SIZE) - (canvas.height / 2) + (TILE_SIZE / 2);

    // 限制相機不要超出地圖邊界
    let maxCamX = (mapData[0].length * TILE_SIZE) - canvas.width;
    let maxCamY = (mapData.length * TILE_SIZE) - canvas.height;

    camX = Math.max(0, Math.min(targetX, maxCamX));
    camY = Math.max(0, Math.min(targetY, maxCamY));
}
    
function nextQuestion() {
    let pool = [];
    const hpPercent = monster.hp / monster.maxHp;
    const canvas = document.getElementById('battleCanvas');

    // 難度與背景顏色判定
    if (hpPercent > 0.7) {
        // 第一階段：正常狀態
        pool = DSE_Library.easy;
        canvas.style.filter = "none"; // 回復正常
        document.getElementById('battleLog').innerText = "第一階段：基礎試煉";
        document.getElementById('battleLog').style.color = "#aaa";
    } 
    else if (hpPercent > 0.3) {
        // 第二階段：黃昏/警戒狀態
        pool = DSE_Library.normal;
        // 增加飽和度與色調偏移，讓畫面偏黃/橘
        canvas.style.filter = "saturate(1.5) hue-rotate(-10deg) sepia(0.2)";
        document.getElementById('battleLog').innerText = "第二階段：進階挑戰！";
        document.getElementById('battleLog').style.color = "#ffd54f";
    } 
    else {
        // 第三階段：狂暴狀態
        pool = DSE_Library.hard;
        // 劇烈的色調偏移（偏紅）與高對比，模擬危機感
        canvas.style.filter = "saturate(2.5) hue-rotate(-40deg) contrast(1.2)";
        document.getElementById('battleLog').innerText = "最終階段：考官狂暴化！！";
        document.getElementById('battleLog').style.color = "#ff4d4d";
        
        // 資深開發者技巧：狂暴時怪物攻擊力增加
        monster.atk = 35; 
    }

    // 隨機抽題邏輯
    currentQ = pool[Math.floor(Math.random() * pool.length)];
    
    // 更新介面 (渲染選項按鈕)
    renderOptions();
}

function renderOptions() {
    document.getElementById('question').innerText = currentQ.q;
    const container = document.getElementById('optionsContainer');
    container.innerHTML = "";
    currentQ.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
    });
}

// --- 確保在腳本最上方 (全域變數區) 加上這行 ---
let currentAction = 'attack';

// ==========================================
// 戰鬥邏輯：三種行為的實踐 (請貼在這裡)
// ==========================================

// 1. 顯示指令選單 (每回合開始時呼叫)
function showActionMenu() {
    isBusy = false;
    // 👇 新增/修改呢幾行：確保主面板顯示，隱藏方向鍵，顯示戰鬥選單
    document.getElementById('ui-panel').style.display = 'block'; 
    document.getElementById('dpad-container').style.display = 'none'; 
    document.getElementById('action-menu').style.display = 'block';
    document.getElementById('quiz-area').style.display = 'none';    
    // 檢查能量是否滿 100，決定要不要顯示必殺技
    const ultBtn = document.getElementById('ult-btn');
    if (player.sp >= 100) {
        ultBtn.style.display = 'inline-block';
    } else {
        ultBtn.style.display = 'none';
    }
}

// 2. 處理玩家點擊選單按鈕
function selectAction(action) {
    currentAction = action;
    
    if (action === 'defend') {
        player.isDefending = true;
        player.sp = Math.min(100, player.sp + 10); // 防禦也能稍微回 10 SP
        document.getElementById('battleLog').innerText = "🛡️ 進入防禦姿態！下擊受傷減半。";
        // 防禦不答題，直接讓怪物攻擊
        setTimeout(enemyTurn, 1000);
    } else {
        // 攻擊 或 必殺技：隱藏選單，顯示題目
        document.getElementById('action-menu').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        nextQuestion(); 
    }
}

// 3. 處理答題結果 (替換原本的 checkAnswer)
function checkAnswer(choice) {
    if (isBusy || player.hp <= 0 || monster.hp <= 0) return;
    isBusy = true;
    
    // 禁用選項按鈕，防止連點
    const btns = document.querySelectorAll('#optionsContainer .opt-btn');
    btns.forEach(b => b.disabled = true);

    if (choice === currentQ.ans) {
        // 答對了！根據選擇的招式決定傷害
        let dmg = player.atk;
        if (currentAction === 'ult') {
            dmg = player.atk * 3; // 必殺技 3 倍傷害
            player.sp = 0;        // 放完大招能量清空
            document.getElementById('battleLog').innerText = "🔥 必殺：極限運算！造成 3 倍傷害！";
            document.getElementById('battleLog').style.color = "#9b59b6";
        } else {
            player.sp = Math.min(100, player.sp + 25); // 普攻加 25 SP
            document.getElementById('battleLog').innerText = "✅ 正確！發動精準打擊！";
            document.getElementById('battleLog').style.color = "#4ecca3";
        }

        monster.takeDamage(dmg);
        
        if (monster.hp <= 0) { 
            winBattle(); 
            return; 
        }
        
        // 答對的話怪物不反擊，1.5 秒後回到指令選單
        setTimeout(showActionMenu, 1500); 

    } else {
        // 答錯了！
        document.getElementById('battleLog').innerText = "❌ 算錯了！招式被斷，考官趁機反擊！";
        document.getElementById('battleLog').style.color = "#ff4d4d";
        // 1 秒後觸發怪物回合
        setTimeout(enemyTurn, 1000);
    }
}

// 4. 怪物回合 (替換原本的 enemyTurn)
function enemyTurn() {
    if (monster.hp <= 0 || player.hp <= 0) return;
    
    // 傷害亂數 (加入 20% 浮動)
    const variance = 0.2;
    const minDmg = Math.floor(monster.atk * (1 - variance));
    const maxDmg = Math.floor(monster.atk * (1 + variance));
    let finalDamage = Math.floor(Math.random() * (maxDmg - minDmg + 1)) + minDmg;

    // 呼叫 takeDamage (裡面已經寫好如果 isDefending = true 會減半傷害)
    player.takeDamage(finalDamage);
    
    document.getElementById('battleLog').innerText = `考官發動攻擊，造成 ${finalDamage} 點傷害！`;
    document.getElementById('battleLog').style.color = "#ff4d4d";
    
     if (player.hp <= 0) {
        document.getElementById('battleLog').innerText = "💀 你戰敗了... 勇者請重新來過。";
        setTimeout(() => {
        location.reload(); // 最簡單的做法：重新整理網頁
      }, 2000);
        } else {
        // 怪物攻擊完畢後，1.5 秒後回到玩家的指令選單
        setTimeout(showActionMenu, 1500);
    }
}

// 新增勝利處理函式
function winBattle() {
    isBusy = true;
    document.getElementById('battleLog').innerText = "✌️ 戰鬥勝利！可以繼續前進了。";
    document.getElementById('battleLog').style.color = "#4ecca3";

    if (player.lastTrapPos) {
        mapData[player.lastTrapPos.y][player.lastTrapPos.x] = 0;
        player.lastTrapPos = null; 
    }

    score += 100;

    setTimeout(() => {
        gameState = "MAP";
        resetMonster(); 
        isBusy = false;
        
        // 👇 UI 切換處理
        document.getElementById('action-menu').style.display = 'none'; // 隱藏行動選單
        document.getElementById('quiz-area').style.display = 'none';   // 👈 新增呢行！強制隱藏題目區
        document.getElementById('dpad-container').style.display = 'flex'; // 顯示方向鍵
        
        document.getElementById('battleLog').innerText = "探索中...";
        document.getElementById('battleLog').style.color = "#aaa";
    }, 1500);
}

// 重置怪物的函式
function resetMonster() {
    monster.hp = monster.maxHp;
    monster.displayHp = monster.maxHp;
    // 如果有不同種類的怪物，也可以在這裡隨機更換圖片或數值
    monster.atk = 25; 
    const canvas = document.getElementById('battleCanvas');
    canvas.style.filter = "none"; // 清除狂暴化濾鏡
}
// --- 替換原本的 resetMonster 函式 ---
// 根據傳入嘅資料嚟設定目前嘅怪獸
function setMonsterData(data) {
    monster.name = data.name;
    monster.maxHp = data.hp;
    monster.hp = data.hp;
    monster.displayHp = data.hp;
    monster.atk = data.atk;
    monster.img = data.img;
    document.getElementById('battleCanvas').style.filter = "none"; // 清除狂暴濾鏡
}


function finishGame(msg) {
    document.getElementById('battleLog').innerText = msg;
    uploadData();
}

function uploadData() {
    const URL = "https://script.google.com/macros/s/AKfycbzUVYuECt3TAy2eOceIKD3F1VCB9xtqhqh8Bqo3r0HJxwGdr6fbTuMXaXn4mxGhRIyv-g/exec"; 
    const data = { name: playerName, score: score, date: new Date().toLocaleString() };
    if (URL.includes("你的_GOOGLE")) {
        alert(`遊戲結束！玩家：${playerName}, 分數：${score}`);
        return;
    }
    fetch(URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) })
    .then(() => alert("成績已上傳至 Google Sheet！"));
}
    
function drawMap() {
    updateCamera(); // 畫地圖前先更新相機位置

    for (let row = 0; row < mapData.length; row++) {
        for (let col = 0; col < mapData[row].length; col++) {
            let tile = mapData[row][col];
            // 關鍵修改：繪圖座標要減去相機座標
            let x = col * TILE_SIZE - camX;
            let y = row * TILE_SIZE - camY;

            // 優化：只畫出在畫面內的格子 (節省效能)
            if (x + TILE_SIZE < 0 || x > canvas.width || y + TILE_SIZE < 0 || y > canvas.height) continue;

            ctx.drawImage(assets.tileGround, x, y, TILE_SIZE, TILE_SIZE);
            if (tile === 1) ctx.drawImage(assets.tileWall, x, y, TILE_SIZE, TILE_SIZE);
            else if (tile === 2) ctx.drawImage(assets.tileGrass, x, y, TILE_SIZE, TILE_SIZE);
            else if (tile === 4) ctx.drawImage(assets.city, x, y, TILE_SIZE, TILE_SIZE);
        }
    }
}


function movePlayer(dx, dy) {
    if (gameState !== "MAP") return;

    let nextX = player.mapX + dx;
    let nextY = player.mapY + dy;

    if (mapData[nextY][nextX] === 1) return; // 撞牆

    player.mapX = nextX;
    player.mapY = nextY;

    let currentTile = mapData[nextY][nextX];

    if (currentTile === 4) {
        document.getElementById('battleLog').innerText = "💀 遇見第一關 BOSS！";
        player.lastTrapPos = {x: nextX, y: nextY}; 
        encounterType = "BOSS";
        startEncounterEffect();
    } else if (currentTile === 3) {
        document.getElementById('battleLog').innerText = "⚠️ 踩到隱藏機關！";
        player.lastTrapPos = {x: nextX, y: nextY}; 
        encounterType = "TRAP";
        startEncounterEffect();
    } else if (currentTile === 2) {
        if (Math.random() < 0.15) {
            document.getElementById('battleLog').innerText = "⚠️ 草叢有動靜！";
            encounterType = "RANDOM";
            startEncounterEffect();
        }
    }
}
// 啟動隨機戰鬥 (草叢遇敵)
function startRandomBattle() {
    gameState = "BATTLE";
    resetMonster(); // 確保怪物血量滿格
    showActionMenu();
    document.getElementById('battleLog').innerText = "⚔️ 草叢中衝出了一隻 DSE 考官！";
}

    // 啟動遇敵閃爍特效
function startEncounterEffect() {
    gameState = "TRANSITION";
    transitionTimer = 0;
    
    // 隱藏所有 UI，等玩家專心睇特效
    document.getElementById('ui-panel').style.display = 'none';
}   
    
// 啟動強制戰鬥
function startForcedBattle(x, y) {
    // 進入戰鬥狀態
    gameState = "BATTLE";
    
    // 戰鬥勝利後要移除這個座標的機關，我們把它存起來
    player.lastTrapPos = {x: x, y: y}; 
    
    resetMonster(); // 確保怪物血量滿格
    showActionMenu();
}
// --- 監聽鍵盤按鍵來移動主角 ---
window.addEventListener('keydown', (e) => {
    // 如果不是在地圖模式，或者遊戲還沒開始，就不允許移動
    if (gameState !== "MAP") return; 

    // W, A, S, D 或 上下左右方向鍵
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
});    

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "MAP") {
        drawMap();
        player.drawOnMap(ctx);
        // ... (保留你原本顯示 UI 嘅代碼) ...

    } else if (gameState === "TRANSITION") {
        // 1. 照樣畫地圖同主角作為底圖
        drawMap();
        player.drawOnMap(ctx);
        
        // 2. 處理閃爍特效 (每 5 個 frame 轉一次顏色)
        transitionTimer++;
        if (transitionTimer % 10 < 5) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; // 閃白
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)"; // 閃黑
        }
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 3. 閃咗大約 1.5 秒 (90 個 frames) 之後，正式進入戰鬥
        if (transitionTimer > 90) {
            gameState = "BATTLE";
            
            if (encounterType === "BOSS") {
                // 打 Boss 
                setMonsterData(bossData);
                document.getElementById('battleLog').innerText = `💀 最終決戰：${bossData.name} 出現了！`;
            } else {
                // 抽一隻隨機怪 (機關同草叢都係抽怪)
                let randomM = regularMonsters[Math.floor(Math.random() * regularMonsters.length)];
                setMonsterData(randomM);
                let text = encounterType === "TRAP" ? "機關觸發！" : "草叢衝出了怪物！";
                document.getElementById('battleLog').innerText = `⚔️ ${text} ${randomM.name} 出現了！`;
            }
            
            showActionMenu();
        }

    } else if (gameState === "BATTLE") {
        // 1. 畫戰鬥背景
        ctx.drawImage(assets.background, 0, 0, canvas.width, canvas.height);
        
        // 2. 畫主角同怪物
        player.draw(ctx);
        monster.draw(ctx);
        
        // 3. 畫受傷數字
        damageTexts.forEach((text, index) => {
            text.update();
            text.draw(ctx);
            if (text.life <= 0) damageTexts.splice(index, 1);
        });
    }
    
    requestAnimationFrame(gameLoop);
}
    
</script>
