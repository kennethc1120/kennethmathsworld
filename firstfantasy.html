<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Hero: 算術勇者傳 (Debugged)</title>
    <style>
        :root { --main-bg: #1a1a2e; --ui-panel: #16213e; --accent: #4ecca3; }
        body { background: var(--main-bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        
        #game-wrapper { margin-top: 20px; border: 4px solid #fff; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { background: #232946; display: block; }

        #ui-panel {
            width: 600px; background: var(--ui-panel); padding: 20px;
            box-sizing: border-box; border-top: 2px solid #fff;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .math-section { text-align: center; border: 2px solid var(--accent); padding: 10px; border-radius: 10px; }
        #question { font-size: 28px; display: block; margin-bottom: 10px; color: var(--accent); font-weight: bold; }
        
        input { width: 80px; font-size: 24px; text-align: center; border-radius: 5px; border: none; outline: none; }
        button { background: var(--accent); color: #1a1a2e; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        button:hover { filter: brightness(1.2); }

        .log-section { font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; height: 80px; overflow-y: hidden; }
        .critical { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="battleCanvas" width="600" height="300"></canvas>
    <div id="ui-panel">
        <div class="math-section">
            <span id="question">載入中...</span>
            <input type="number" id="ansInput" onkeydown="if(event.key==='Enter') attack()">
            <button onclick="attack()">攻擊</button>
        </div>
        <div class="log-section" id="battleLog">
            <div>準備戰鬥！輸入正確答案發動攻擊。</div>
        </div>
    </div>
</div>

<script>
// --- 全域管理 ---
let damageTexts = [];

// --- 浮動文字類別 ---
class FloatingText {
    constructor(value, x, y, color = "#ffeb3b") {
        this.value = value;
        this.x = x;
        this.y = y;
        this.color = color;
        this.opacity = 1;
        this.life = 60;
        this.velocityV = -1.5;
    }

    update() {
        this.y += this.velocityV;
        this.life--;
        this.opacity = Math.max(0, this.life / 60);
    }

    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.font = "bold 24px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText(this.value, this.x, this.y);
        ctx.restore();
    }
}

// --- 角色類別 ---
class Character {
    constructor(name, hp, atk, x, y, color, isPlayer = false) {
        this.name = name;
        this.maxHp = hp;
        this.hp = hp;
        this.atk = atk;
        this.x = x;
        this.y = y;
        this.color = color;
        this.isPlayer = isPlayer;
        
        this.shakeTimer = 0;
        this.flashTimer = 0;
        this.displayHp = hp;
    }

    takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        this.shakeTimer = 15; // 震動感
        this.flashTimer = 5;  // 閃白感
        
        // 產生浮動數字
        const textX = this.x + 30 + (Math.random() - 0.5) * 20;
        const textY = this.y - 10;
        damageTexts.push(new FloatingText(`-${amount}`, textX, textY, this.isPlayer ? "#ff4d4d" : "#ffd54f"));
    }

    update() {
        if (this.displayHp > this.hp) {
            this.displayHp -= 0.5; 
            if (this.displayHp < this.hp) this.displayHp = this.hp;
        }
    }

    draw(ctx) {
        this.update();
        ctx.save();

        let renderX = this.x;
        let renderY = this.y;

        if (this.shakeTimer > 0) {
            renderX += (Math.random() - 0.5) * 8;
            this.shakeTimer--;
        }

        // 畫本體
        ctx.fillStyle = this.color;
        ctx.fillRect(renderX, renderY, 60, 60);

        // 受擊閃白
        if (this.flashTimer > 0) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(renderX, renderY, 60, 60);
            this.flashTimer--;
        }

        // 血條
        const barW = 60;
        const barH = 8;
        const displayPercent = this.displayHp / this.maxHp;

        ctx.fillStyle = "#333";
        ctx.fillRect(renderX, renderY - 20, barW, barH);

        // 變色邏輯
        if (displayPercent < 0.3) ctx.fillStyle = "#ff4d4d";
        else if (displayPercent < 0.6) ctx.fillStyle = "#ffd54f";
        else ctx.fillStyle = "#4caf50";

        ctx.fillRect(renderX, renderY - 20, barW * displayPercent, barH);

        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(this.name, renderX + 30, renderY - 25);

        ctx.restore();
    }
}

// --- 邏輯管理器 ---
const MathManager = {
    ans: 0,
    generate() {
        const a = Math.floor(Math.random() * 89) + 10;
        const b = Math.floor(Math.random() * 89) + 10;
        this.ans = a + b;
        document.getElementById('question').innerText = `${a} + ${b} = ?`;
    }
};

const canvas = document.getElementById('battleCanvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('battleLog');

// 建立角色 (名字, HP, 攻擊力, X, Y, 顏色, 是否為玩家)
const player = new Character("勇者", 100, 30, 100, 150, "#4ecca3", true);
const monster = new Character("魔王 Slime", 120, 20, 440, 150, "#e94560", false);

let isBusy = false;

function addLog(msg, isCrit = false) {
    const div = document.createElement('div');
    if (isCrit) div.className = 'critical';
    div.innerText = `> ${msg}`;
    logEl.prepend(div);
}

function attack() {
    if (isBusy || player.hp <= 0 || monster.hp <= 0) return;
    
    const input = document.getElementById('ansInput');
    const userVal = parseInt(input.value);
    
    if (userVal === MathManager.ans) {
        executePlayerTurn();
    } else {
        addLog("答案錯誤，吟唱失敗！");
        executeEnemyTurn();
    }
    input.value = '';
    input.focus();
}

function executePlayerTurn() {
    isBusy = true;
    monster.takeDamage(player.atk); // 使用 takeDamage 觸發特效
    addLog(`答對了！你對怪物造成 ${player.atk} 點傷害`);
    
    MathManager.generate();
    
    if (monster.hp <= 0) {
        addLog("擊敗怪物！勝利！", true);
        return;
    }

    setTimeout(executeEnemyTurn, 1000);
}

function executeEnemyTurn() {
    if (monster.hp <= 0) return;
    player.takeDamage(monster.atk); // 怪物攻擊玩家
    addLog(`怪物反擊，造成 ${monster.atk} 點傷害`);
    
    if (player.hp <= 0) {
        addLog("你倒下了... GAME OVER", true);
    } else {
        isBusy = false;
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製簡單裝飾線
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.beginPath(); ctx.moveTo(0, 210); ctx.lineTo(600, 210); ctx.stroke();

    player.draw(ctx);
    monster.draw(ctx);

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        damageTexts[i].update();
        damageTexts[i].draw(ctx);
        if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
}

// 初始化
MathManager.generate();
gameLoop();

</script>
</body>
</html>
