<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港中文大學校友會聯會張煊昌中學 學會報名系統 - 學生查詢網頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-blue-50 min-h-screen font-sans flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div id="app" class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100 relative">
        
        <!-- 連線中遮罩 -->
        <div v-if="isLoading" class="absolute inset-0 bg-white bg-opacity-80 rounded-xl z-50 flex flex-col justify-center items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-blue-600 mb-3"></div>
            <p class="text-sm font-semibold text-gray-600">正在向雲端查詢，請稍候...</p>
        </div>

        <div>
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-blue-100 text-blue-600 text-3xl">
                🔍
            </div>
            <h2 class="mt-4 text-center text-2xl font-extrabold text-gray-950">
                香港中文大學校友會聯會張煊昌中學 學會報名查詢 💬
            </h2>
            <p class="mt-2 text-center text-xs text-gray-500">
                請輸入您的基本資料與專屬密碼，即可確認目前的錄取學會
            </p>
        </div>

        <form class="mt-8 space-y-6" @submit.prevent="handleQuery">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">您的班別</label>
                    <select v-model="inputClass" class="appearance-none rounded-md relative block w-full px-3 py-2.5 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-base" required>
                        <option value="">請選擇班別...</option>
                        <option v-for="c in classes" :key="c" :value="c">{{ c }}</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">您的學號</label>
                    <input v-model="inputStudentId" type="text" placeholder="例如: 10001" class="appearance-none rounded-md relative block w-full px-3 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-base font-mono" required />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">學生查詢密碼</label>
                    <input v-model="inputStudentPassword" type="password" placeholder="請輸入您的個人密碼" class="appearance-none rounded-md relative block w-full px-3 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-base font-mono" required />
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-lg font-bold rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    驗證並查詢
                </button>
            </div>
        </form>

        <!-- 查詢結果區塊 -->
        <div v-if="queryResult" class="mt-6 border-t pt-6">
            <h3 class="text-sm font-semibold text-gray-500 tracking-wider uppercase mb-3">查詢結果</h3>
            
            <div class="p-4 rounded-lg" :class="queryResult.registeredClub ? 'bg-green-50 border border-green-200' : 'bg-yellow-50 border border-yellow-200'">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm text-gray-500">學生姓名</span>
                    <span class="text-lg font-bold text-gray-900">{{ queryResult.name }} ({{ queryResult.sClass }} 班)</span>
                </div>
                
                <hr class="my-2 border-gray-200" />

                <!-- 已報名狀態 -->
                <div v-if="queryResult.registeredClub">
                    <div class="flex flex-col items-center py-4">
                        <span class="text-xs text-green-600 font-bold px-2 py-0.5 bg-green-100 rounded-full mb-1">🎉 報名成功</span>
                        <span class="text-2xl font-black text-green-800 my-1">{{ queryResult.registeredClub }}</span>
                        <span class="text-xs text-gray-400 mt-2">登記時間：{{ queryResult.regTime }}</span>
                    </div>
                </div>

                <!-- 尚未報名狀態 -->
                <div v-else>
                    <div class="flex flex-col items-center py-4 text-center">
                        <span class="text-3xl mb-2">⚠️</span>
                        <span class="text-base font-bold text-yellow-800">您尚未成功登記任何學會</span>
                        <p class="text-xs text-gray-500 mt-1">請盡快至報名系統進行登記。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 錯誤提示 -->
        <div v-if="errorMsg" class="mt-6 p-3 bg-red-50 border border-red-200 rounded text-red-800 text-sm font-semibold text-center">
            ❌ {{ errorMsg }}
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                // ⚠️ 請在此處貼上您部署 Google Apps Script 後取得的網頁應用程式 URL 
                const GAS_URL = "https://script.google.com/macros/s/AKfycbwu4gRHmVBm3O5yNAVUTbsXNTYc3g4RL58PzKNGAb0bBoMApQRNSCzDz1h4bymGFtCA/exec"; 

                const classes = ref([]); 
                const inputClass = ref('');
                const inputStudentId = ref('');
                const inputStudentPassword = ref(''); // 新增：學生密碼綁定
                const isLoading = ref(true);
                const queryResult = ref(null);
                const errorMsg = ref('');

                // 初始化載入可用班別
                const loadClasses = async () => {
                    isLoading.value = true;
                    try {
                        const response = await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "init" })
                        });
                        const data = await response.json();
                        if (data.status === "success") {
                            classes.value = data.classes || [];
                        }
                    } catch (error) {
                        alert("讀取班級清單失敗，請確認網路連線或 GAS 設定！");
                    } finally {
                        isLoading.value = false;
                    }
                };

                onMounted(() => {
                    if (GAS_URL !== "YOUR_GAS_WEB_APP_URL") {
                        loadClasses();
                    } else {
                        alert("請先修改程式碼中的 GAS_URL 設定！");
                        isLoading.value = false;
                    }
                });

                // 發送個人報名查詢 (附帶密碼)
                const handleQuery = async () => {
                    isLoading.value = true;
                    queryResult.value = null;
                    errorMsg.value = '';

                    try {
                        const response = await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                action: "query",
                                studentId: inputStudentId.value.trim(),
                                sClass: inputClass.value,
                                studentPassword: inputStudentPassword.value.trim() // 傳送密碼供驗證
                            })
                        });
                        const result = await response.json();

                        if (result.status === "success") {
                            queryResult.value = result;
                        } else {
                            errorMsg.value = result.message;
                        }
                    } catch (e) {
                        errorMsg.value = "連線失敗，請稍後重試。";
                    } finally {
                        isLoading.value = false;
                    }
                };

                return {
                    classes, inputClass, inputStudentId, inputStudentPassword, isLoading, queryResult, errorMsg, handleQuery
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
