<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港中文大學校友會聯會張煊昌中學 學會報名查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div id="app" class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-xl border border-gray-200 relative">
        
        <!-- 全域連線遮罩 -->
        <div v-if="isLoading" class="absolute inset-0 bg-white bg-opacity-80 rounded-xl z-50 flex flex-col justify-center items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-slate-700 mb-3"></div>
            <p class="text-sm font-semibold text-gray-600">正在寫入雲端試算表，請稍候...</p>
        </div>

        <div>
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-slate-100 text-slate-700 text-3xl">
                💼
            </div>
            <h2 class="mt-4 text-center text-2xl font-extrabold text-gray-900">
                學會名單行政登錄 
            </h2>
            <p class="mt-2 text-center text-xs text-gray-500">
                【老師專用內部通道】密碼由系統設定 J2 指定，崗位清單同步自 E 欄
            </p>
        </div>

        <form class="mt-8 space-y-4" @submit.prevent="handleRegister">
            <div class="space-y-4 rounded-md">
                
                <!-- 1. 老師安全驗證碼 (對應 J2) -->
                <div>
                    <label class="block text-sm font-bold text-red-700 mb-1">🔑 報名密碼 (請輸入系統設定 J2 密碼)</label>
                    <input v-model="teacherPassword" type="password" placeholder="請輸入老師登記驗證碼" class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-slate-600 focus:border-slate-600 text-base font-mono bg-amber-50/50" required />
                </div>

                <hr class="border-gray-200 my-2"/>

                <!-- 2. 選擇負責的學會 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">📌 負責學會/隊伍</label>
                    <select v-model="selectedClub" class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 text-gray-900 focus:outline-none focus:ring-slate-500 focus:border-slate-500 text-base bg-white" required>
                        <option value="">請選擇您要登錄名單的學會...</option>
                        <option v-for="club in clubs" :key="club" :value="club">{{ club }}</option>
                    </select>
                </div>

                <!-- 3. 選擇學生班別 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">📊 學生班別</label>
                    <select v-model="inputClass" class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 text-gray-900 focus:outline-none focus:ring-slate-500 focus:border-slate-500 text-base bg-white" required>
                        <option value="">請選擇班別...</option>
                        <option v-for="c in classes" :key="c" :value="c">{{ c }}</option>
                    </select>
                </div>

                <!-- 4. 輸入學生學號 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">🆔 學生學號</label>
                    <input v-model="inputStudentId" type="text" ref="studentIdInput" placeholder="請輸入學生學號" class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-slate-500 focus:border-slate-500 text-base font-mono" required />
                </div>

                <!-- 5. 【動態讀取】選擇擔任的崗位職位 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">🎖️ 擔任崗位 (資料取自系統設定 E 欄)</label>
                    <select v-model="selectedPosition" class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 text-gray-900 focus:outline-none focus:ring-slate-500 focus:border-slate-500 text-base bg-white" required>
                        <option v-for="pos in positions" :key="pos" :value="pos">{{ pos }}</option>
                    </select>
                </div>

            </div>

            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-base font-bold rounded-md text-white bg-slate-800 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition-colors shadow">
                    確認登錄此學生
                </button>
            </div>
        </form>

        <!-- 狀態提示回饋 -->
        <div v-if="hintMsg" :class="isSuccess ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'" class="mt-4 p-4 border rounded-md text-sm font-semibold whitespace-pre-line">
            {{ isSuccess ? '🚀 ' : '❌ ' }}{{ hintMsg }}
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                // ⚠️ 請換上您部署後的 Web App URL
                const GAS_URL = "https://script.google.com/macros/s/AKfycbwu4gRHmVBm3O5yNAVUTbsXNTYc3g4RL58PzKNGAb0bBoMApQRNSCzDz1h4bymGFtCA/exec"; 

                const classes = ref([]);
                const clubs = ref([]);
                const positions = ref([]);
                
                const teacherPassword = ref('');
                const selectedClub = ref('');
                const inputClass = ref('');
                const inputStudentId = ref('');
                const selectedPosition = ref('會員'); // 預設值設為會員
                
                const isLoading = ref(true);
                const hintMsg = ref('');
                const isSuccess = ref(false);
                const studentIdInput = ref(null);

                // 初始化載入班別、學會與動態崗位
                const loadInitData = async () => {
                    isLoading.value = true;
                    try {
                        const response = await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "init" })
                        });
                        const data = await response.json();
                        if (data.status === "success") {
                            classes.value = data.classes || [];
                            clubs.value = data.clubs || [];
                            positions.value = data.positions || [];
                            
                            // 💡 檢查從 E 欄讀取到的崗位中是否有「會員」，有的話自動設為預設選取項目
                            if (positions.value.includes('會員')) {
                                selectedPosition.value = '會員';
                            } else if (positions.value.length > 0) {
                                // 如果裡面沒有包含「會員」兩個字，就預設選第一個項目
                                selectedPosition.value = positions.value[0];
                            }
                        }
                    } catch (error) {
                        alert("初始化資料載入失敗，請確認網路或 GAS 後端發布狀態！");
                    } finally {
                        isLoading.value = false;
                    }
                };

                onMounted(() => {
                    loadInitData();
                });

                // 提交登記
                const handleRegister = async () => {
                    isLoading.value = true;
                    hintMsg.value = '';
                    isSuccess.value = false;

                    try {
                        const response = await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify({
                                action: "register",
                                teacherPassword: teacherPassword.value.trim(),
                                sClass: inputClass.value,
                                studentId: inputStudentId.value.trim(),
                                clubName: selectedClub.value,
                                position: selectedPosition.value
                            })
                        });
                        const result = await response.json();

                        if (result.status === "success") {
                            isSuccess.value = true;
                            hintMsg.value = result.message;
                            
                            // 批次輸入優化：成功後只清空學號，方便連續輸入
                            inputStudentId.value = '';
                            
                            // 如果試算表內仍有會員，重設回預設值會員
                            if (positions.value.includes('會員')) {
                                selectedPosition.value = '會員';
                            }
                            
                            // 自動將游標點回學號框，手不用離開鍵盤
                            nextTick(() => {
                                if (studentIdInput.value) studentIdInput.value.focus();
                            });
                        } else {
                            isSuccess.value = false;
                            hintMsg.value = result.message;
                        }
                    } catch (e) {
                        isSuccess.value = false;
                        hintMsg.value = "連線失敗，請檢查網路或密碼配置。";
                    } finally {
                        isLoading.value = false;
                    }
                };

                return {
                    classes, clubs, positions, teacherPassword, selectedClub, inputClass, inputStudentId, selectedPosition, isLoading, hintMsg, isSuccess, handleRegister, studentIdInput
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
